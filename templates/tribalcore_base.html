<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#101a33">
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="/assets/site.css">
  {% block assets %}{% endblock %}
  <title>{% block title %}NightScout{% endblock %} · TRIBALCORE</title>
</head>
<body>
  <a class="skip-link" href="#main">К содержанию</a>
  <header class="top">
    <div class="shell top-inner">
      <a class="brand" href="/" translate="no"><i class="mark" aria-hidden="true"></i>TRIBALCORE</a>
      {% if user %}
        <form action="{{ url_for('logout') }}" method="post">
          <input type="hidden" name="csrf" value="{{ csrf }}">
          <button class="btn btn-small" type="submit">Выйти</button>
        </form>
      {% endif %}
    </div>
  </header>
  <main class="shell" id="main" tabindex="-1">{% block content %}{% endblock %}</main>
</body>
</html>
