# Public 443 is owned by an nginx stream SNI router (not in this repository): connections for
# tribalcore.bond / www arrive here on 127.0.0.1:8445 with a PROXY protocol header.

# Site pages and assets: browsers keep their copy but check with the server (ETag) on every visit,
# so a deploy shows up at once. NightScout's own responses keep whatever caching the panel sets.
map $uri $tribalcore_cache {
    ~^/(nightscout|login|logout)  "";
    default                       "no-cache";
}

server {
    listen 80;
    server_name tribalcore.bond www.tribalcore.bond;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tribalcore-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://tribalcore.bond$request_uri;
    }
}

# www, and the old pilot address with :8443, go to the canonical address.
server {
    listen 127.0.0.1:8445 ssl proxy_protocol;
    listen 8443 ssl;
    server_name www.tribalcore.bond;
    ssl_certificate /etc/letsencrypt/live/tribalcore.bond/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tribalcore.bond/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://tribalcore.bond$request_uri;
}

server {
    listen 8443 ssl;
    server_name tribalcore.bond;
    ssl_certificate /etc/letsencrypt/live/tribalcore.bond/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tribalcore.bond/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://tribalcore.bond$request_uri;
}

server {
    listen 127.0.0.1:8445 ssl proxy_protocol;
    server_name tribalcore.bond;
    root /opt/tribalcore/public;
    # The stream router passes the visitor's address in a PROXY header; NightScout's login
    # limits are per IP, so it must see the real one (nightscout.proxy.inc forwards $remote_addr).
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    # Behind the stream router: keep redirects relative so they never leak the internal port.
    absolute_redirect off;

    ssl_certificate /etc/letsencrypt/live/tribalcore.bond/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tribalcore.bond/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Cache-Control $tribalcore_cache always;

    # Compress text assets and 3D models (three.js alone is ~690 KB raw). gzip itself is on in nginx.conf.
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json application/xml text/plain model/gltf-binary;

    # Site-styled page for every 404 the site itself returns (NightScout's own responses are untouched).
    error_page 404 /404.html;
    location = /404.html { internal; }

    location = / { try_files /index.html =404; }
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location ^~ /assets/models/ { types { } default_type model/gltf-binary; try_files $uri =404; }
    location ~ ^/projects/(nightscout|debugych|meeting-to-spec|quizroom|ai-trader)$ { try_files /projects/$1/index.html =404; }
    location ~ ^/projects/(nightscout|debugych|meeting-to-spec|quizroom|ai-trader)/$ { return 308 /projects/$1; }
    location ^~ /assets/ { try_files $uri =404; }
    # Standalone example pages for prospective clients (noindex, not in the menu or sitemap).
    # A new example = its folder in public/demo/ plus its name in the two lists below.
    location ~ ^/demo/(kovrochist|prokat70)$ { return 308 /demo/$1/; }
    location ~ ^/demo/(kovrochist|prokat70)/$ { try_files /demo/$1/index.html =404; }
    # Plain prefix (not ^~), so the two regex locations above still win for the page URLs.
    location /demo/ { try_files $uri =404; }

    location = /login { include /opt/tribalcore/deploy/nightscout.proxy.inc; }
    location = /logout { include /opt/tribalcore/deploy/nightscout.proxy.inc; }
    location = /nightscout { include /opt/tribalcore/deploy/nightscout.proxy.inc; }
    location ^~ /nightscout/ { include /opt/tribalcore/deploy/nightscout.proxy.inc; }

    location / { return 404; }
}
