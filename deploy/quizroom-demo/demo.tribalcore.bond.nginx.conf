# QuizRoom demo. Installed as /etc/nginx/conf.d/demo.tribalcore.bond.conf.
# HTTPS arrives from the SNI router on 127.0.0.1:8445 (same as the main site) with a PROXY header.

limit_req_zone $binary_remote_addr zone=quizroom_auth:1m rate=10r/m;

map $http_upgrade $quizroom_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name demo.tribalcore.bond;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tribalcore-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://demo.tribalcore.bond$request_uri;
    }
}

server {
    listen 127.0.0.1:8445 ssl proxy_protocol;
    server_name demo.tribalcore.bond;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    absolute_redirect off;

    ssl_certificate /etc/letsencrypt/live/demo.tribalcore.bond/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.tribalcore.bond/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    client_max_body_size 6m;

    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Visitors' uploaded images: served inert, so an uploaded SVG cannot run scripts on this origin.
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3101;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/api/auth/ {
        limit_req zone=quizroom_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $quizroom_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
